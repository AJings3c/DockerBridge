<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101416">
    <meta name="description" content="DockerBridge local Docker control plane">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="manifest" href="/manifest.json">
    <title>DockerBridge</title>
    <script>
        (() => {
            try {
                const stored = localStorage.getItem("dockerbridge-theme");
                const theme = stored === "light" || stored === "dark"
                    ? stored
                    : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
                document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#1b1b1d" : "#f5f5f7");
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
</head>
<body>
    <noscript>DockerBridge 需要启用 JavaScript。</noscript>
    <div id="root"></div>
</body>
</html>
